name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  ghdl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ymahrous/risc-pipelined-processor
          path: rtl-repo
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ghdl
      - run: npm ci
      - run: npx vitest run src/lib/ghdl.integration.test.ts
        env:
          RTL_DIR: ${{ github.workspace }}/rtl-repo/src/rtl

  verilog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - run: npm ci
      - run: node scripts/build-reference.mjs --check
      - run: npx vitest run src/lib/icarus.integration.test.ts
